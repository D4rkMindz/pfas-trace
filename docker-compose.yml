# Local MLflow tracking stack (development only, credentials are not secret)
#   postgres: stores experiments, runs, params and metrics
#   mlflow:   tracking server + UI on http://localhost:5050, stores model files in a volume
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_MLFLOW_USER}
      POSTGRES_PASSWORD: ${POSTGRES_MLFLOW_PASSWORD}
      POSTGRES_DB: ${POSTGRES_MLFLOW_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "mlflow" ]
      interval: 5s
      retries: 10

  mlflow:
    build: docker/mlflow
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "5050:5000"  # host port 5050, because macOS uses 5000 for AirPlay
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "localhost:5050,127.0.0.1:5050"
    command: >
      mlflow server
      --host 0.0.0.0
      --port 5000
      --backend-store-uri postgresql://${POSTGRES_MLFLOW_USER}:${POSTGRES_MLFLOW_PASSWORD}@postgres:5432/${POSTGRES_MLFLOW_PASSWORD}
      --artifacts-destination /mlartifacts
    volumes:
      - mlflow-artifacts:/mlartifacts

volumes:
  postgres-data:
  mlflow-artifacts:
