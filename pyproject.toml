[project]
name = "pfas-trace"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Boris Lauper", email = "boris.lauper@stud.hslu.ch" },
    { name = "Björn Pfoster", email= "bjoern.pfoster@stud.hslu.ch"},
]
requires-python = ">=3.14"
dependencies = [
    "anywidget>=0.11.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "jupyterlab>=4.6.4",
    "matplotlib>=3.11.2",
    "mlflow>=3.17.1",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyarrow>=25.0.1",
    "pydantic-settings>=2.15.0",
    "requests>=2.34.2",
    "scikit-learn>=1.9.1",
    "seaborn>=0.13.2",
]

[project.scripts]
pfas-trace = "pfas_trace:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"
